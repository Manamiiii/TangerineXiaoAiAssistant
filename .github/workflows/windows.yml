name: Windows installer checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-2022
    timeout-minutes: 35
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements-build.lock
            requirements-runtime.lock
      - name: Install locked build dependencies
        run: python -m pip install -r requirements-build.lock
      - name: Install project without resolving new dependencies
        run: python -m pip install --no-deps --no-build-isolation -e .
      - name: Dependency consistency
        run: python -m pip check
      - name: Source tests
        run: python -m unittest discover -s tests -v
      - name: Public file privacy check
        run: python scripts/check_public_files.py
      - name: Diff whitespace check
        run: git diff --check
      - name: Build Windows x64 Setup and Portable
        run: python scripts/build.py --installer
      - name: Verify production package and provenance
        run: python scripts/verify_package.py --package-dir dist/0.4.1/TangerineXiaoAiAssistant
      - name: Frozen app smoke with isolated profile
        run: python scripts/smoke_exe.py --package-dir dist/0.4.1/TangerineXiaoAiAssistant
      - name: Build isolated installer fixture
        run: |
          $fixtureId = [guid]::NewGuid().ToString()
          python scripts/build.py --output-dir build/installer-fixture --fixture-id $fixtureId --installer
      - name: Verify fixture package
        run: python scripts/verify_package.py --package-dir build/installer-fixture/TangerineXiaoAiAssistant
      - name: Installer lifecycle with fictional data
        run: python scripts/test_installer_lifecycle.py --package-dir build/installer-fixture/TangerineXiaoAiAssistant
      # Intentionally no release, upload-artifact, signing or binary publishing step.
