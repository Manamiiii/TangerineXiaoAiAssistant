[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tangerine-xiaoai-assistant"
version = "0.3.0"
description = "A minimal Windows assistant controlled by XiaoAI speaker commands"
readme = "README.md"
license-files = ["licenses/*.txt", "licenses/*.md", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.11"
dependencies = ["requests>=2.32.5,<3", "pycaw>=20251023", "comtypes>=1.4.12,<2", "pystray>=0.19.5,<1", "Pillow>=11,<13"]

[project.optional-dependencies]
build = ["pyinstaller>=6.16,<7"]

[project.scripts]
xiaoai-pc = "xiaoai_pc.cli:main"

[project.gui-scripts]
xiaoai-pc-desktop = "xiaoai_pc.cli:desktop_main"

[tool.setuptools.packages.find]
where = ["src"]
