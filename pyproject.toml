[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tangerine-xiaoai-assistant"
version = "0.1.0"
description = "A minimal Windows assistant controlled by XiaoAI speaker commands"
readme = "README.md"
license-files = ["licenses/*.txt", "licenses/*.md", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.11"
dependencies = ["requests>=2.32.5,<3"]

[project.optional-dependencies]
build = ["pyinstaller>=6.16,<7"]

[project.scripts]
xiaoai-pc = "xiaoai_pc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
